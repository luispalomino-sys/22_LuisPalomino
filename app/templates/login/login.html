<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-700">

    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">
                    Iniciar sesión
                </h1>
                <p class="text-gray-500 mt-1">
                    Ingresa tus datos para acceder
                </p>
            </div>

            {% if mensaje %}
            <div class="mb-5 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm">
                {{ mensaje }}
            </div>
            {% endif %}

            <form method="post"
                  action="{{ url_for('login.login') }}"
                  class="bg-white border border-gray-200 rounded-lg p-8">

                <!-- LÍNEA AGREGADA -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Correo electrónico
                    </label>
                    <input type="email"
                           name="correo"
                           required
                           placeholder="tucorreo@ejemplo.com"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>
                    <input type="password"
                           name="clave"
                           required
                           placeholder="••••••••"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Entrar
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                ¿No tienes una cuenta?
                <a href="{{ url_for('login.registro') }}" class="text-blue-600 hover:underline">
                    Regístrate
                </a>
            </p>

            <p class="text-center text-sm mt-4">
                <a href="/" class="text-gray-400 hover:text-gray-600">
                    &larr; Volver al inicio
                </a>
            </p>

        </div>
    </main>

</body>
</html>
